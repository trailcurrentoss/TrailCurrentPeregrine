# TrailCurrent Peregrine (ZimaBoard 2) — GRUB defaults
# Headless appliance: no menu unless the previous boot failed.
GRUB_TIMEOUT_STYLE=hidden
GRUB_TIMEOUT=0
GRUB_RECORDFAIL_TIMEOUT=5
# usbcore.autosuspend=-1 holds every USB device on until peregrine-power
# re-enables autosuspend for everything except audio and HID.
GRUB_CMDLINE_LINUX_DEFAULT="quiet splash usbcore.autosuspend=-1 consoleblank=60"
