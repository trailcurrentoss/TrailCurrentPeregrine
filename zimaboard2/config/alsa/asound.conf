# TrailCurrent Peregrine (ZimaBoard 2) — ALSA default device config
# Onboard audio is blacklisted (modprobe/blacklist-audio.conf), so the Jabra
# Speak USB is card 0. assistant.py finds the Jabra by name regardless; this
# only sets the default for aplay/arecord without -D (self-test, shell use).

defaults.pcm.card 0
defaults.pcm.device 0
defaults.ctl.card 0
